[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "tests"
cache_path = "cache"

remappings = [
    "forge-std/=lib/forge-std/src/"
]

# Monad Devnet/Testnet Configuration
[rpc_endpoints]
monad = "https://rpc-devnet.monad.xyz"

[etherscan]
monad = { key = "${MONAD_EXPLORER_API_KEY}" }
