name: MonMate
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Fixed WebRTC and WalletConnect dependencies
  flutter_webrtc: 0.11.6+hotfix.1
  walletconnect_flutter_v2: ^2.4.1

  # Downgraded package_info_plus to match walletconnect_flutter_v2
  package_info_plus: ^7.0.0
  device_info_plus: ^10.1.0
  livekit_client: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
