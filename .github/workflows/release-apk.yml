name: Build and Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Force Android v2 Migration & Patch WebRTC/Isar
        run: |
          rm -rf android
          flutter create --platforms=android .
          
          # Patch isar namespace
          cat << 'EOF' >> android/build.gradle
          subprojects {
              afterEvaluate { project ->
                  if (project.name == 'isar_flutter_libs' && project.hasProperty('android')) {
                      project.android {
                          if (namespace == null) {
                              namespace 'dev.isar.isar_flutter_libs'
                          }
                      }
                  }
              }
          }
          EOF

          # Patch out the dead v1 Registrar code from cached flutter_webrtc plugin
          WEBRTC_PLUGIN_DIR=$(find ~/.pub-cache -type d -name "flutter_webrtc*" | head -n 1)
          if [ -d "$WEBRTC_PLUGIN_DIR" ]; then
            echo "Patching flutter_webrtc at $WEBRTC_PLUGIN_DIR"
            find "$WEBRTC_PLUGIN_DIR" -name "FlutterWebRTCPlugin.java" -exec sed -i '/import io.flutter.plugin.common.PluginRegistry.Registrar;/d' {} \;
            find "$WEBRTC_PLUGIN_DIR" -name "FlutterWebRTCPlugin.java" -exec sed -i '/public static void registerWith(Registrar registrar) {/,/}/d' {} \;
          fi

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact (Every Run)
        uses: actions/upload-artifact@v4
        with:
          name: MonMate-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
