include: package:flutter_lints/recommended.yaml

linter:
  rules:
    avoid_print: true
    prefer_const_constructors: true

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
